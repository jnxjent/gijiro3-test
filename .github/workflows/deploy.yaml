name: Deploy Gijiro3 (Web & Function)

on:
  push:
    branches:
      - flex-test

jobs:
  webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python for Web
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build web virtualenv
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build web artifact (zip)
        run: |
          zip -r build.zip . \
            -x "ProcessAudioFunction/**" \
               ".git/**" ".github/**" \
               "*/__pycache__/**" "**/__pycache__/**" \
               "*.log" "*.tar" "*.tar.gz" "*.zip" \
               "GIJIRO BACKUP/**" "GIJIRO_BACKUP/**" "backup/**" "BACKUP/**" \
               ".venv/**" "venv/**" ".pytest_cache/**" ".mypy_cache/**"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_TEST }}
          package: build.zip
          clean: true

  functionapp:
    runs-on: ubuntu-latest
    needs: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python for Function
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install function dependencies
        run: |
          cd ProcessAudioFunction
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Function
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_TEST }}
          package: ProcessAudioFunction
          scm-do-build-during-deployment: false